<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>השלמת משפטים - Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html" class="topbar-brand">🏠 חזרה לדף הבית</a>
    <div class="auth-bar" id="auth-bar"></div>
  </div>

  <header>
    <h1>✏️ השלמת משפטים <span class="level-badge">רמה מתקדמת</span></h1>
    <div class="stats">
      <span id="score">ניקוד: 0</span>
      <span id="streak">רצף: 0</span>
    </div>
  </header>

  <div class="category-bar">
    <label for="category">קטגוריה:</label>
    <select id="category"></select>
  </div>

  <p id="loading-message" class="hint">טוען מילים...</p>

  <main id="game-content" class="hidden">
    <section id="round-view" class="view">
      <div class="quiz-progress">
        <span id="fb-progress-text">משפט 1 מתוך 10</span>
        <div class="progress-bar"><div id="fb-progress-fill"></div></div>
      </div>

      <p class="scramble-prompt">השלימו את המשפט עם המילה הנכונה:</p>
      <div class="fill-blank-sentence" id="fb-sentence"></div>

      <div class="quiz-options" id="fb-options"></div>
      <div id="fb-feedback" class="quiz-feedback"></div>
    </section>

    <section id="fb-results-view" class="view hidden">
      <h2>הסיבוב הושלם! 🎉</h2>
      <p id="fb-results-summary"></p>
      <button id="fb-restart">שחקו שוב</button>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script type="module" src="auth-ui.js"></script>
<script type="module" src="fill-blank.js"></script>
</body>
</html>
