<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="home-header">
    <h1>📚 Learn English</h1>
    <p class="tagline">Build your vocabulary with flashcards, quizzes and games.</p>
    <div class="stats">
      <span id="score">Score: 0</span>
      <span id="streak">Streak: 0</span>
    </div>
  </header>

  <main class="game-menu">
    <a class="game-card" href="flashcards.html">
      <span class="game-icon">🗂️</span>
      <span class="game-title">Flashcards &amp; Quiz</span>
      <span class="game-desc">Flip cards to learn new words, then test yourself with a multiple-choice quiz.</span>
    </a>

    <a class="game-card" href="scramble.html">
      <span class="game-icon">🔤</span>
      <span class="game-title">Word Scramble</span>
      <span class="game-desc">Unscramble the jumbled letters to guess the word before you run out of hints.</span>
    </a>
  </main>
</div>

<script>
  document.getElementById("score").textContent = `Score: ${localStorage.getItem("eng-score") || 0}`;
  document.getElementById("streak").textContent = `Streak: ${localStorage.getItem("eng-streak") || 0}`;
</script>
</body>
</html>
