<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אתגר האזנה - Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html" class="topbar-brand">🏠 חזרה לדף הבית</a>
    <div class="auth-bar" id="auth-bar"></div>
  </div>

  <header>
    <h1>🎧 אתגר האזנה <span class="level-badge">רמה מתקדמת</span></h1>
    <div class="stats">
      <span id="score">ניקוד: 0</span>
      <span id="streak">רצף: 0</span>
    </div>
  </header>

  <div class="category-bar">
    <label for="category">קטגוריה:</label>
    <select id="category"></select>
  </div>

  <p id="unsupported-message" class="hint hidden">
    הדפדפן שלכם לא תומך בהקראה קולית (Web Speech API). נסו בדפדפן אחר, כמו Chrome או Edge.
  </p>
  <p id="loading-message" class="hint">טוען מילים...</p>

  <main id="game-content" class="hidden">
    <section id="round-view" class="view">
      <div class="quiz-progress">
        <span id="ls-progress-text">מילה 1 מתוך 10</span>
        <div class="progress-bar"><div id="ls-progress-fill"></div></div>
      </div>

      <p class="scramble-prompt">הקשיבו וכתבו את מה ששמעתם:</p>
      <button id="ls-play-btn" class="listen-play-btn" type="button">🔊 השמיעו</button>

      <form id="ls-form" autocomplete="off">
        <input type="text" id="ls-input" placeholder="הקלידו כאן..." autocapitalize="off" spellcheck="false" style="direction: ltr;">
        <button type="submit">בדיקה ✓</button>
      </form>

      <div id="ls-feedback" class="quiz-feedback"></div>

      <div class="scramble-controls">
        <button id="ls-hint-btn" type="button">💡 רמז (תרגום)</button>
        <button id="ls-skip-btn" type="button">דלגו</button>
      </div>
    </section>

    <section id="ls-results-view" class="view hidden">
      <h2>הסיבוב הושלם! 🎉</h2>
      <p id="ls-results-summary"></p>
      <button id="ls-restart">שחקו שוב</button>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script type="module" src="auth-ui.js"></script>
<script type="module" src="listening.js"></script>
</body>
</html>
