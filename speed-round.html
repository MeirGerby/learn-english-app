<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סבב מהיר - Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html" class="topbar-brand">🏠 חזרה לדף הבית</a>
    <div class="auth-bar" id="auth-bar"></div>
  </div>

  <header>
    <h1>⏱️ סבב מהיר <span class="level-badge">רמה מתקדמת</span></h1>
    <div class="stats">
      <span id="score">ניקוד: 0</span>
      <span id="streak">רצף: 0</span>
    </div>
  </header>

  <div class="category-bar">
    <label for="category">קטגוריה:</label>
    <select id="category"></select>
  </div>

  <p id="loading-message" class="hint">טוען מילים...</p>

  <main id="game-content" class="hidden">
    <section id="round-view" class="view">
      <div class="quiz-progress">
        <span id="sr-progress-text">שאלה 1 מתוך 12</span>
        <div class="progress-bar"><div id="sr-progress-fill"></div></div>
      </div>

      <div class="timer-bar"><div id="sr-timer-fill"></div></div>

      <div class="quiz-question">
        <p class="quiz-prompt">מה המשמעות של הביטוי?</p>
        <h2 id="sr-word">word</h2>
      </div>
      <div class="quiz-options" id="sr-options"></div>
      <div id="sr-feedback" class="quiz-feedback"></div>
    </section>

    <section id="sr-results-view" class="view hidden">
      <h2>הסבב הושלם! 🎉</h2>
      <p id="sr-results-summary"></p>
      <button id="sr-restart">שחקו שוב</button>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script type="module" src="auth-ui.js"></script>
<script type="module" src="speed-round.js"></script>
</body>
</html>
