<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כרטיסיות וחידון - למידת אנגלית</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html" class="topbar-brand">🏠 חזרה לדף הבית</a>
    <div class="auth-bar" id="auth-bar"></div>
  </div>

  <header>
    <h1>🗂️ כרטיסיות וחידון</h1>
    <div class="stats">
      <span id="score">ניקוד: 0</span>
      <span id="streak">רצף: 0</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-mode="flashcards">כרטיסיות</button>
    <button class="tab-btn" data-mode="quiz">חידון</button>
  </nav>

  <div class="category-bar">
    <label for="category">קטגוריה:</label>
    <select id="category"></select>
  </div>

  <p id="loading-message" class="hint">טוען מילים...</p>

  <main id="game-area" class="hidden">
    <!-- Flashcards mode -->
    <section id="flashcards-view" class="view">
      <div class="card-wrap">
        <div class="card" id="flashcard">
          <div class="card-face card-front">
            <span class="word" id="fc-word">word</span>
          </div>
          <div class="card-face card-back">
            <span class="definition" id="fc-def">definition</span>
            <span class="example" id="fc-example">example sentence</span>
          </div>
        </div>
      </div>
      <p class="hint">לחצו על הכרטיס כדי להפוך אותו</p>
      <div class="controls">
        <button id="fc-prev">הקודם</button>
        <span id="fc-progress">1 מתוך 10</span>
        <button id="fc-next">הבא</button>
      </div>
      <div class="know-controls">
        <button id="fc-unknown" class="btn-unknown">עדיין לומד/ת</button>
        <button id="fc-known" class="btn-known">אני כבר יודע/ת ✓</button>
      </div>
    </section>

    <!-- Quiz mode -->
    <section id="quiz-view" class="view hidden">
      <div class="quiz-progress">
        <span id="quiz-progress-text">שאלה 1 מתוך 10</span>
        <div class="progress-bar"><div id="quiz-progress-fill"></div></div>
      </div>
      <div class="quiz-question">
        <p class="quiz-prompt">מה המשמעות של המילה?</p>
        <h2 id="quiz-word">word</h2>
      </div>
      <div class="quiz-options" id="quiz-options"></div>
      <div id="quiz-feedback" class="quiz-feedback"></div>
      <button id="quiz-next" class="hidden">לשאלה הבאה</button>
    </section>

    <!-- Results -->
    <section id="results-view" class="view hidden">
      <h2>סיימתם את החידון! 🎉</h2>
      <p id="results-summary"></p>
      <button id="quiz-restart">נסו שוב</button>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="auth-ui.js"></script>
</body>
</html>
