<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה - Learn English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html" class="topbar-brand">📚 Learn English</a>
    <div class="auth-bar" id="auth-bar"></div>
  </div>

  <main class="auth-page">
    <h1>הרשמה</h1>
    <form id="register-form" class="auth-form">
      <label for="reg-email">אימייל</label>
      <input type="email" id="reg-email" required autocomplete="email">

      <label for="reg-password">סיסמה</label>
      <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">

      <label for="reg-confirm">אימות סיסמה</label>
      <input type="password" id="reg-confirm" required minlength="6" autocomplete="new-password">

      <p id="register-error" class="form-error"></p>

      <button type="submit">הרשמה</button>
    </form>
    <p class="auth-switch">כבר יש לכם חשבון? <a href="login.html">התחברות</a></p>
  </main>
</div>

<script type="module" src="auth-ui.js"></script>
<script type="module" src="register.js"></script>
</body>
</html>
