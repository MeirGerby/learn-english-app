<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Learn English</title>
    <script>
      // GitHub Pages SPA redirect trick (github.com/rafgraph/spa-github-pages):
      // it can only serve real files, so a direct navigation/refresh on a
      // client-side route (e.g. /learn-english-app/games/flashcards) 404s
      // here. Re-encode the path into the query string and redirect to
      // index.html, which decodes it back via history.replaceState (see the
      // inline script in index.html).
      var pathSegmentsToKeep = 1; // "/learn-english-app"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
