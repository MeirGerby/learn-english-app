<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ערבוב מילים - למידת אנגלית</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <a class="back-link" href="index.html">🏠 חזרה לדף הבית</a>
  <header>
    <h1>🔤 ערבוב מילים</h1>
    <div class="stats">
      <span id="score">ניקוד: 0</span>
      <span id="streak">רצף: 0</span>
    </div>
  </header>

  <div class="category-bar">
    <label for="category">קטגוריה:</label>
    <select id="category"></select>
  </div>

  <main>
    <section class="view">
      <div class="scramble-progress">
        <span id="scramble-progress-text">מילה 1 מתוך 10</span>
        <div class="progress-bar"><div id="scramble-progress-fill"></div></div>
      </div>

      <p class="scramble-prompt">סדרו את האותיות כדי לגלות את המילה:</p>
      <div class="scramble-letters" id="scramble-letters"></div>

      <p class="scramble-hint-text" id="scramble-hint-text"></p>

      <form id="scramble-form" autocomplete="off">
        <input type="text" id="scramble-input" placeholder="הקלידו את התשובה..." autocapitalize="off" spellcheck="false">
        <button type="submit">בדיקה ✓</button>
      </form>

      <div id="scramble-feedback" class="quiz-feedback"></div>

      <div class="scramble-controls">
        <button id="scramble-hint-btn">💡 רמז</button>
        <button id="scramble-skip-btn">דלגו</button>
      </div>
    </section>

    <section id="scramble-results-view" class="view hidden">
      <h2>הסיבוב הושלם! 🎉</h2>
      <p id="scramble-results-summary"></p>
      <button id="scramble-restart">שחקו שוב</button>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script src="scramble.js"></script>
</body>
</html>
